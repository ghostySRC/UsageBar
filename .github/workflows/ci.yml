name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore UsageBar.sln
      - name: Build
        run: dotnet build UsageBar.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test UsageBar.sln --configuration Release --no-build --verbosity minimal
